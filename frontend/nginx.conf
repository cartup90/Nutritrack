# ---------------------------------------------------------------------------
# Nginx para la PWA NutriTrack
#
#  · SPA fallback: todas las rutas sirven index.html
#  · El service worker NUNCA se cachea (evita quedarse en una versión antigua)
#  · Los assets con hash sí se cachean agresivamente
#  · Proxy /api y /uploads hacia el contenedor de la API
#  · Cabeceras de seguridad
# ---------------------------------------------------------------------------

upstream nutritrack_api {
    server api:5000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # --- Cabeceras de seguridad ------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    # --- Service worker y manifest: siempre frescos ----------------------
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        types { application/manifest+json json; }
        try_files $uri =404;
    }

    # --- Assets con hash: caché inmutable --------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Íconos -----------------------------------------------------------
    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://nutritrack_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El análisis con IA puede tardar; ampliamos los timeouts
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --- Imágenes subidas --------------------------------------------------
    location /uploads/ {
        proxy_pass http://nutritrack_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # --- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
