# ---------------------------------------------------------------------------
# Nginx para ANI
#
#  · /            → landing (frontend/landing/indexANI.html)
#  · /app         → la PWA (build de Vite, en dist/app)
#  · /app/sw.js   → el service worker NUNCA se cachea (evita quedarse viejo)
#  · /app/assets/ → assets con hash: caché agresiva
#  · /api, /uploads → proxy hacia el contenedor de la API
#  · Cabeceras de seguridad
#
#  Nota: la API vive en la RAÍZ (/api), no bajo /app, para que la app pueda
#  llamarla sin depender de dónde esté montada.
# ---------------------------------------------------------------------------

upstream nutritrack_api {
    server api:5000;
}

server {
    listen 80;
    server_name _;

    # Caddy (TLS) habla con nginx por HTTP, así que sin esto nginx generaría
    # redirecciones "http://..." y el navegador daría un salto extra. Con
    # `off`, nginx manda Location relativas y el cliente conserva el esquema.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # --- Cabeceras de seguridad ------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    # --- Landing (raíz del dominio) ---------------------------------------
    # `expires -1` en vez de add_header: no corta la herencia de las cabeceras
    # de seguridad de arriba.
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    # --- /app sin barra → /app/ (el scope de la PWA es /app/) -------------
    location = /app {
        return 301 /app/;
    }

    # --- Service worker de la app: siempre fresco -------------------------
    location = /app/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/app/" always;
        try_files $uri =404;
    }

    # --- Manifest de la app: siempre fresco -------------------------------
    location = /app/manifest.json {
        add_header Cache-Control "no-cache" always;
        types { application/manifest+json json; }
        try_files $uri =404;
    }

    # --- Assets con hash: caché inmutable ---------------------------------
    location /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Íconos -----------------------------------------------------------
    location /app/icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://nutritrack_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El análisis con IA puede tardar; ampliamos los timeouts
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --- Imágenes subidas --------------------------------------------------
    location /uploads/ {
        proxy_pass http://nutritrack_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # --- SPA de la app: cualquier ruta bajo /app sirve su index -----------
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # --- Resto (p. ej. /favicon.ico) → landing ----------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
